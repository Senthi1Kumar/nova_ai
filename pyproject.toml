[project]
name = "nova-ai"
version = "0.1.0"
description = "Nova AI: Real-time conversational intelligence platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "websockets",
    "bitsandbytes",
    "accelerate",
    "pynvml",
    "psutil",
    "soundfile",
    "scipy",
    "python-multipart",
    "pydub",
    # onnxruntime-gpu – uncomment exactly ONE line below for your platform.
    # Jetson / ARM64 (Thor):
    # "onnxruntime-gpu @ https://pypi.jetson-ai-lab.io/sbsa/cu130/+f/012/c10bef23a39f0/onnxruntime_gpu-1.24.0-cp312-cp312-linux_aarch64.whl#sha256=012c10bef23a39f074730d158b72f797a7314f2695c65835a0669b57282422f6  ; platform_machine == 'aarch64'",
    # x86_64 (Arch, etc.) – uses ort-nightly index:
    "onnxruntime-gpu; platform_machine == 'x86_64'",
    "pyaudio",
    "torch<2.10",
    "torchvision<0.25",
    "torchaudio<2.10",
    "torchcodec",
    "coloredlogs",
    "flatbuffers",
    "protobuf",
    "nvidia-ml-py",
    "speechbrain==1.0.2", # 1.0.3
    "deepface>=0.0.99",
    "opencv-python>=4.13.0.92",
    "cryptography>=46.0.5",
    "python-jose>=3.5.0",
    #"huggingface-hub==0.23.4", # 0.36.2
    "tf-keras>=2.20.1",
    "openai>=2.24.0",
    "pydantic>=2.0",
    "datasets[audio]>=4.7.0",
    "transformers",
    "moonshine-voice>=0.0.49",
    "setproctitle>=1.3.7",
    "fastrtc[stt,tts,vad]>=0.0.34",
    "asyncpg>=0.31.0",
    "pymicro-features>=2.0.2",
    "ai-edge-litert>=2.1.3",
    "webrtcvad>=2.0.10",
    "webrtcvad-wheels>=2.0.14",
    # Barge-in during TTS: WebRTC AEC3 via livekit.rtc.apm + silero-vad on cleaned mic.
    "livekit>=1.1.5",
    "silero-vad>=5.1",
    # Kokoro TTS — fast (sub-100 ms TTFT on GPU), 24 kHz native, ~330 MB VRAM.
    "kokoro>=0.9.4",
    "microwakeword",
    # "faster-qwen3-tts>=0.2.5",
    "mmap-ninja>=0.8.2",
    "msgpack",
    "kaldiio>=2.18.1",
    "textgrid>=1.6.1",
    "cn2an>=0.5.23",
    "kaldi-native-fbank>=1.22.3",
    "qwen-asr>=0.0.6",
    "nemo-toolkit[asr]>=2.7.3",
    "kokoro-onnx>=0.5.0",
    "pocket-tts>=2.1.0",
    "moshi>=0.2.13",
    "textual>=8.2.6",
    "httpx>=0.28.1",
    "sounddevice>=0.5.0",
    "numpy>=2.2.6",
    # Web search for the web_search tool — Tavily is LLM-optimized (returns
    # extracted content + optional direct answer), Serper kept as fallback.
    "tavily-python>=0.5.0",
]

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "ort-nightly"
url = "https://aiinfra.pkgs.visualstudio.com/PublicPackages/_packaging/ORT-Nightly/pypi/simple/"
explicit = true

[tool.uv.sources]
microwakeword = { path = "nova/backend/kws/micro-wake-word" }
onnxruntime-gpu = { index = "ort-nightly" }
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
torchcodec = { index = "pytorch-cu130" }
# transformers pinned to PyPI release — moshi requires huggingface-hub<1.0,
# which is incompatible with transformers git HEAD (needs hub>=1.5).

[dependency-groups]
dev = [
    "ruff>=0.15.4",
    "pytest>=8.0",
    "jiwer",
    "ipykernel>=7.2.0",
    "ipython>=9.12.0",
    "jupyterlab>=4.5.6",
    "notebook>=7.5.5",
    "ipywidgets>=8.1.8",
]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
extraPaths = [
    "nova/backend",
    "nova/backend/nova-l7/L-7",
    "nova/backend/nova-l7/L-3",
    "nova/backend/kws",
    "nova/backend/pipeline_mp",
    "./nova/backend/kws/micro-wake-word"]
reportMissingModuleSource = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v -m 'not e2e'"
markers = [
    "e2e: end-to-end tests that load real models (deselected by default)",
]

